name: Synquote
description: 'Synquote is a decentralized crypto options trading platform that lets traders obtain
  options quotes directly from market makers using a request-for-quote (RFQ) model. Founded in 2021
  by former Google engineer Ahmed Attia and based in San Francisco, the platform offers European-style
  options across ETH, BTC, AVAX, LINK and MATIC with liquidity spanning 500+ instruments. It pairs a
  centralized-exchange-like experience (social/Google logins, two-click trading, zero-gas trading,
  maker rebates and low taker fees) with DeFi self-custody, and supports undercollateralized margin
  trading for liquidity providers to improve capital efficiency. Backed by Initialized Capital and
  Polygon, Synquote raised $2.8M and launched publicly in June 2023 after a beta exceeding $25M in
  notional volume. Added to the API Evangelist network as a crypto/DeFi portfolio profile.'
